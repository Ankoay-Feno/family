# Services d'infrastructure du dev :
#   docker compose up -d minio createbucket   → stockage objet des photos (S3-compatible)
#   docker compose up -d db                   → PostgreSQL (quand le dev dépasse SQLite)
#
# Pour PostgreSQL, dans .env :
#   DATABASE_URL="postgresql://familytree:familytree@localhost:5432/familytree"
# et dans prisma/schema.prisma : provider = "postgresql"
# (remplacer aussi @prisma/adapter-better-sqlite3 par @prisma/adapter-pg dans lib/prisma.ts)
#
# En production, remplacez MinIO par Cloudflare R2 ou S3 : seules les variables
# S3_* du .env changent, le code est identique.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: familytree
      POSTGRES_PASSWORD: familytree
      POSTGRES_DB: familytree
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: familytree
      MINIO_ROOT_PASSWORD: familytree-secret
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web
    volumes:
      - miniodata:/data

  # Job ponctuel : crée le bucket "fianakaviana" et le rend lisible publiquement
  # (les photos sont servies directement par leur URL).
  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 familytree familytree-secret; do sleep 1; done;
      mc mb --ignore-existing local/fianakaviana;
      mc anonymous set download local/fianakaviana;
      "

volumes:
  pgdata:
  miniodata:
